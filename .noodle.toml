# Noodle loop config, generated by brigade init.
mode = "auto"

[routing.defaults]
provider = "claude"
model = "claude-opus-5-5"

[skills]
paths = [".agents/skills", ".claude/skills"]

[concurrency]
max_concurrency = 1   # the Brigade governor raises/lowers this live

[schedule]            # the scheduler only runs kit/plan_orders.py: a small model is plenty
model = "claude-haiku-5-5"
min_interval = "5m"   # changes inside the interval are batched into the next run

[agents.claude]
path = "/Users/shaharcohen/.brigade/bin"   # Brigade claude wrapper: caps, spend breaker, timeout, sandbox

[merge]
strategy = "pr"
branch_prefix = "agent/"
labels = ["agent"]
verdict_command = "/Users/shaharcohen/.brigade/bin/brigade verdict post"

[adapters.backlog]
skill = "schedule"

[adapters.backlog.scripts]
sync = "python3 /Users/shaharcohen/.brigade/kit/adapters/github/sync.py"
done = "python3 /Users/shaharcohen/.brigade/kit/adapters/github/done.py"
add = "python3 /Users/shaharcohen/.brigade/kit/adapters/github/add.py"
edit = "python3 /Users/shaharcohen/.brigade/kit/adapters/github/edit.py"

[server]
port = 3301
